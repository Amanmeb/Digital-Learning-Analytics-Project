<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camara Learning -- Welcome</title>
    <link rel="icon" href="/assets/favicon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .welcome-card {
            background: white;
            border-radius: 10px;
            padding: 40px;
            width: 360px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            text-align: center;
        }
        h1 { color: #375C7A; font-size: 22px; margin-bottom: 8px; }
        .time-counter {
            font-size: 36px;
            color: #81BC00;
            font-weight: bold;
            margin: 24px 0 4px 0;
        }
        .time-label { color: #555; font-size: 14px; margin-bottom: 24px; }
        .goal { color: #943266; font-size: 14px; margin-bottom: 24px; }
        .btn-logout {
            width: 100%;
            padding: 12px;
            background: #375C7A;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="welcome-card">
        <h1>Welcome, {{ full_name }}</h1>
        <div class="time-counter">{{ today_minutes }} min</div>
        <div class="time-label">logged in today</div>
        <div class="goal">Daily goal: {{ daily_goal }} minutes</div>
        <form method="post" action="/logout">
            <button type="submit" class="btn-logout">Log out</button>
        </form>
    </div>
</body>
</html>
