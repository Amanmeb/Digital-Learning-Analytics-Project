<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camara Learning -- Login</title>
    <link rel="icon" href="/assets/favicon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background-image: url('/assets/login_background.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 10px;
            padding: 40px;
            width: 360px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            text-align: center;
        }
        .logos { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .logos img { height: 64px; }
        h1 { color: #375C7A; font-size: 20px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; text-align: left; }
        label { display: block; font-size: 14px; margin-bottom: 6px; color: #555; }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #81BC00;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
        }
        .error {
            background: #fde8ee;
            color: #943266;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logos">
            <img src="/assets/camara_logo.png" alt="Camara">
            <img src="/assets/school_logo.png" alt="School">
        </div>
        <h1>Welcome back</h1>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post" action="/login">
            <div class="form-group">
                <label for="student_id">Student ID</label>
                <input type="text" id="student_id" name="student_id" required>
            </div>
            <div class="form-group">
                <label for="credential">Password or PIN</label>
                <input type="password" id="credential" name="credential" required>
            </div>
            <button type="submit" class="btn-login">Log in</button>
        </form>
    </div>
</body>
</html>
